[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phoneinfo-cli"
version = "0.1.0"
description = "Look up phone number validity, carrier, country, timezone and type from the terminal."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "phonenumbers>=8.13",
]

[project.scripts]
phoneinfo = "phoneinfo_cli.cli:main"

[tool.setuptools]
packages = ["phoneinfo_cli"]
